[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repair-interpolation"
version = "0.1.0"
description = "Activation alignment and REPAIR for neural-network interpolation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
cifar = ["torchvision>=0.17"]
plots = ["matplotlib>=3.8"]

[project.scripts]
repair-experiment = "repair.experiment:main"

[tool.setuptools]
license-files = ["upstream/LICENSE.pytorch-cifar", "upstream/PROVENANCE.md"]

[tool.setuptools.packages.find]
where = ["src"]
